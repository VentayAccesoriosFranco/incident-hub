trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  name: Default
  demands:
    - Agent.Name -equals agente-local-01

variables:
  nodeVersion: '20.x'

stages:
  - stage: Build
    displayName: Build y pruebas
    jobs:
      - job: BuildBackend
        displayName: Build del backend
        steps:
          - checkout: self
            displayName: Checkout del repositorio

          - task: NodeTool@0
            displayName: Instalar Node
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            displayName: Instalar dependencias
            workingDirectory: backend

          - script: npm run build
            displayName: Build (verificacion de sintaxis)
            workingDirectory: backend

          - script: npm test
            displayName: Pruebas automatizadas
            workingDirectory: backend

          - script: npm audit --audit-level=high
            displayName: Revision de dependencias (npm audit)
            workingDirectory: backend
            continueOnError: true

          - task: CopyFiles@2
            displayName: Preparar contenido del artefacto
            inputs:
              SourceFolder: '$(Build.SourcesDirectory)'
              Contents: |
                backend/src/**
                backend/package.json
                backend/package-lock.json
                database/schema.sql
                devops/docker-compose.yml
              TargetFolder: '$(Build.ArtifactStagingDirectory)/package'

          - task: ArchiveFiles@2
            displayName: Empaquetar artefacto
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/package'
              includeRootFolder: false
              archiveType: zip
              archiveFile: '$(Build.ArtifactStagingDirectory)/incident-hub-$(Build.BuildId).zip'
              replaceExistingArchive: true

          - task: PublishBuildArtifacts@1
            displayName: Publicar artefacto
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/incident-hub-$(Build.BuildId).zip'
              ArtifactName: 'drop'

  - stage: Deploy_Dev
    displayName: Despliegue a DEV
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployDev
        displayName: Desplegar en dev
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@0
                  displayName: Descargar artefacto drop
                  inputs:
                    buildType: current
                    downloadType: single
                    artifactName: drop
                    downloadPath: '$(System.ArtifactsDirectory)'

                - script: dir "$(System.ArtifactsDirectory)\drop"
                  displayName: Verificar artefacto drop

                - script: echo Despliegue simulado en DEV
                  displayName: Despliegue en DEV

  - stage: Deploy_QA
    displayName: Despliegue a QA
    dependsOn: Deploy_Dev
    condition: succeeded()
    jobs:
      - deployment: DeployQA
        displayName: Desplegar en qa
        environment: qa
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo Despliegue simulado en QA
                  displayName: Despliegue en QA

  - stage: Deploy_Prod
    displayName: Despliegue a PROD
    dependsOn: Deploy_QA
    condition: succeeded()
    jobs:
      - deployment: DeployProd
        displayName: Desplegar en prod
        environment: prod
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo Despliegue simulado en PROD
                  displayName: Despliegue en PROD