services:
  db:
    image: postgres:16
    container_name: incident-hub-db
    environment:
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident_dev
      POSTGRES_DB: incident_hub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  pgdata: